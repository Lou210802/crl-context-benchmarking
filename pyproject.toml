[project]
name = "crl-context-benchmarking"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[box2d]>=1.3.0",
    "hydra-core>=1.3.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "pandas<3.0",
    "pandas-stubs~=2.3.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "rliable",
    "carl-bench",
    "swig>=4.4.1",
    "optuna>=4.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

